<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Controle Financeiro</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg:#eef2fb;--cd:#fff;--tx:#0f1b3d;--mu:#64708c;--bd:#e6eaf3;--pr:#2563eb;--gr:#16a34a;--sf:#f3f6fc;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

button,select,input{font:inherit;color:inherit}button{cursor:pointer}
.app{display:flex;gap:16px;max-width:1400px;margin:0 auto;padding:12px}main{flex:1;min-width:0}
.side{display:none;width:220px;flex:none;flex-direction:column;gap:8px;position:sticky;top:12px;height:calc(100vh - 24px);background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px}
.br{display:flex;align-items:center;gap:8px;margin-bottom:12px}.lg{background:var(--pr);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700}

.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600}.ic{background:var(--sf);border:1px solid var(--bd);border-radius:10px;width:34px;height:34px;padding:0}.gh{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}

@media(min-width:900px){.side{display:flex}.mob{display:none!important}.g{grid-template-columns:repeat(6,minmax(0,1fr))}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.rw{grid-row:span 2}}

.ramo{display:flex;gap:20px;flex-wrap:wrap;align-items:center}.ramo>div:last-child{flex:1;min-width:230px}.cr{margin:8px 0}.cr>div{display:flex;justify-content:space-between;gap:8px}.cr span{display:block;height:4px;border-radius:3px;margin-top:3px}
.pills{display:flex;gap:6px;float:right}.pl{border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--mu)}.pl.on{background:var(--tx);color:var(--cd);border-color:var(--tx)}
.hist{display:flex;gap:6px;align-items:flex-end;margin-top:8px}.col{flex:1;text-align:center}.bar{height:130px;display:flex;flex-direction:column-reverse;gap:1px}.bar i{display:block;border-radius:2px}
.pg{height:7px;background:var(--sf);border-radius:5px;overflow:hidden;margin-top:6px}.pg i{display:block;height:100%;background:var(--pr)}
.r{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--bd)}.rn{flex:1;min-width:150px}.rn select{margin-top:4px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:3px 6px}.ra{display:flex;align-items:center;gap:10px;margin-left:auto}.ra>div{text-align:right}
.pill{border:0;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;background:var(--sf);color:var(--mu)}.pill.on{background:#1e3a8a;color:#fff}.x{background:none;border:0;font-size:20px;color:var(--mu)}
.bd{background:var(--sf);border-radius:6px;padding:1px 6px;font-weight:700;font-size:12px}.sub{padding-left:14px;border-left:3px solid var(--bd);margin-left:4px}

dialog label{display:block;margin:10px 0 3px;font-size:12px;color:var(--mu)}dialog input,dialog select,dialog textarea{font:inherit;width:100%;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--sf)}.two{display:flex;gap:8px}.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style></head><body>
<div class="app"><aside class="side"><div class="br"><span class="lg">P</span><b>Controle Financeiro</b></div><button class="nv on">Pedro</button><div class="sp"></div><button class="nv" data-a="cats">Categorias</button><button class="nv" data-a="th">☾ Modo noturno</button><button class="nv" data-a="cfg">⚙ Ajustes</button></aside>
<main><div class="card top"><div class="mn"><button class="ic" data-a="pm">‹</button><h1 id="mt"></h1><button class="ic" data-a="nm">›</button></div><div class="tr"><button class="ic mob" data-a="th">☾</button><button class="ic mob" data-a="cfg">⚙</button><button class="btn" data-a="add">+ Adicionar gasto</button></div></div><div class="g" id="g"></div></main></div><dialog id="dg"></dialog>
<script>
const CATS={Casa:'#2f7bdc',Gatos:'#e8603c',Alimentação:'#16a97a',Combustível:'#eba50b','Uso próprio':'#e879a6',Assinatura:'#16a34a',Roupas:'#6d4fd6','E-commerce':'#dc4a4a',Outros:'#9aa3b5'};
const MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],MA=MN.map(m=>m.slice(0,3));
const $=s=>document.querySelector(s),R=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const addM=(y,k)=>{let[a,b]=y.split('-').map(Number);b+=k-1;a+=Math.floor(b/12);b=((b%12)+12)%12;return a+'-'+String(b+1).padStart(2,'0')},lbl=y=>MN[+y.slice(5)-1]+' de '+y.slice(0,4),DM=d=>d.slice(8)+'/'+d.slice(5,7);
const mine=e=>e.t/(e.h?2:1)-(e.o||[]).reduce((a,o)=>a+o.a,0),sum=l=>l.reduce((a,e)=>a+mine(e),0);
function seed(){let n=0;const M='2026-11',D='2026-12-',x=(n_,d,c,h,t,card,o,i)=>({id:++n,n:n_,m:M,d:D+d,c,h,t,card,p:0,o:o||[],i:i||null});
return[x('Aluguel','05','Casa',1,1800),x('Telefone','08','Outros',0,70),x('Havan','10','Casa',1,130),x('Água DMAE','12','Casa',1,100),x('Luz CEEE','14','Casa',1,210),x('Internet','15','Casa',1,129.7),x('Móveis','18','Casa',1,340),x('Peugeot','20','Uso próprio',0,250,0,0,[9,24]),
x('Posto de gasolina','07','Combustível',0,360,1),x('Supermercado','07','Alimentação',0,278.9,1),x('Farmácia','07','Outros',0,112.1,1),x('Renner','07','Roupas',0,159.9,1,0,[2,3]),x('Loja online','07','E-commerce',0,89.9,1),x('Streaming','07','Assinatura',0,44.35,1),x('Academia e lazer','07','Uso próprio',0,380,1),x('Cobasi POA','07','Gatos',0,135.99,1,[{w:'Pai',a:68,r:0}])]}
let S=null,ym=new Date().toISOString().slice(0,7),open=0,fd='',flt='a',clr=0;
try{S=JSON.parse(localStorage.getItem('cf1'))}catch(e){}
if(!S)S={sal:5200,ex:seed(),id:100,th:''};
applyCats();
const save=()=>{try{localStorage.setItem('cf1',JSON.stringify(S))}catch(e){}};
const theme=()=>{if(S.th)document.documentElement.dataset.theme=S.th};theme();
const row=e=>`<div class="r"><input type="checkbox" data-a="pay" data-i="${e.id}" ${e.p?'checked':''}><div class="rn"><b>${esc(e.n)}</b>${e.i?` <span class="bd">${e.i[0]}/${e.i[1]}</span>`:''}<small>vence ${DM(e.d)}</small><select data-a="cat" data-i="${e.id}">${Object.keys(CATS).map(c=>`<option ${c===e.c?'selected':''}>${c}</option>`).join('')}</select></div><div class="ra"><button class="pill ${e.h?'on':''}" data-a="tg" data-i="${e.id}">${e.h?'Da casa':'Pessoal'}</button><div><b>${R(mine(e))}</b>${e.h?`<small>total ${R(e.t)}</small>`:''}</div><button class="x" data-a="ed" data-i="${e.id}" aria-label="Editar">✎</button><button class="x" data-a="del" data-i="${e.id}" aria-label="Excluir">×</button></div></div>`;
function render(){
const L=S.ex.filter(e=>e.m===ym),per=sum(L.filter(e=>!e.h)),hs=sum(L.filter(e=>e.h)),free=S.sal-per-hs,cd=L.filter(e=>e.card),nc=L.filter(e=>!e.card);
const rcv=L.flatMap(e=>(e.o||[]).map((o,j)=>({e,o,j}))).filter(x=>!x.o.r),rt=rcv.reduce((a,x)=>a+x.o.a,0);
const B=nc.map(e=>({k:e.id,n:e.n,d:e.d,a:mine(e),p:e.p,s:e.h?` · da casa · sua parte de ${R(e.t)}`:''}));
if(cd.length)B.push({k:'card',n:'Fatura do cartão',d:cd.map(e=>e.d).sort()[0],a:sum(cd),p:cd.every(e=>e.p),s:` · ${cd.length} compras`});
B.sort((a,b)=>a.d<b.d?-1:1);const days=[...new Set(B.map(b=>b.d))];if(fd&&!days.includes(fd))fd='';
const VB=fd?B.filter(b=>b.d===fd):B,pend=B.filter(b=>!b.p).reduce((a,b)=>a+b.a,0),tt=per+hs;
const FL=L.filter(e=>flt==='p'?!e.h:flt==='h'?e.h:1),ct={};FL.forEach(e=>ct[e.c]=(ct[e.c]||0)+mine(e));
const cs=Object.entries(ct).sort((a,b)=>b[1]-a[1]),tot=cs.reduce((a,x)=>a+x[1],0),C=251.33;let off=0;
const ring=cs.map(([c,v])=>{const l=tot>0?v/tot*C:0,s=`<circle r="40" cx="50" cy="50" fill="none" stroke="${CATS[c]||'#999'}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l;return s}).join('');
const ms=[-5,-4,-3,-2,-1,0].map(k=>addM(ym,k)),md=ms.map(m=>{const o={};S.ex.filter(e=>e.m===m).forEach(e=>o[e.c]=(o[e.c]||0)+mine(e));return o}),mx=Math.max(1,...md.map(o=>Object.values(o).reduce((a,b)=>a+b,0)));
const P=L.filter(e=>e.i),pm=P.reduce((a,e)=>a+mine(e),0),pf=P.reduce((a,e)=>a+mine(e)*(e.i[1]-e.i[0]),0);
const who=[...new Set(rcv.map(x=>x.o.w))],fw=Math.max(0,Math.min(100,free/S.sal*100)),pw=Math.min(100,per/S.sal*100),hw=Math.min(100-pw,hs/S.sal*100);
$('#mt').textContent=lbl(ym)[0].toUpperCase()+lbl(ym).slice(1);
$('#g').innerHTML=`
<section class="card s4"><h2>Saldo livre</h2><div class="big" style="color:${free<0?'var(--rd)':'inherit'}">${R(free)}</div><small>Salário de ${R(S.sal)} menos gastos pessoais e a parte da casa</small>
<div class="bar3"><i style="width:${pw}%;background:#2f7bdc"></i><i style="width:${hw}%;background:#1e3a8a"></i><i style="width:${fw}%;background:#16a34a"></i></div>
<div class="lgd"><div><small><i class="d" style="background:#2f7bdc"></i>Gastos pessoais</small><b>${R(per)}</b></div><div><small><i class="d" style="background:#1e3a8a"></i>Minha parte da casa (50%)</small><b>${R(hs)}</b></div><div><small><i class="d" style="background:#16a34a"></i>A receber de outros</small><b>${R(rt)}</b><small>já descontado dos seus gastos</small></div><div><small><i class="d" style="background:#16a34a"></i>Livre para gastar</small><b style="color:var(--gr)">${R(free)}</b></div></div></section>
<section class="card s2 rw"><h2>Contas a pagar</h2><div class="big">${R(tt)}</div><small>Sua parte nas contas de ${lbl(ym)} · ${B.length} vencimentos · ${B.filter(b=>b.p).length} de ${B.length} pagas</small>
<div class="chips"><button class="chip ${fd?'':'on'}" data-a="fd" data-d=""><b>Todas</b><small style="color:inherit">${B.length} contas</small></button>${days.map(d=>`<button class="chip ${fd===d?'on':''}" data-a="fd" data-d="${d}"><b>${d.slice(8)}</b><small style="color:inherit">${MA[+d.slice(5,7)-1]}</small></button>`).join('')}</div>
<small style="display:flex;justify-content:space-between"><span>${fd?DM(fd):'Todas do mês'}</span><span>${R(pend)} em aberto</span></small>
${VB.map(b=>`<div class="ln"><div><input type="checkbox" data-a="pay" data-i="${b.k}" ${b.p?'checked':''}> <b>${esc(b.n)}</b><small>vence ${DM(b.d)}${esc(b.s)}</small></div><div class="am">${R(b.a)}</div></div>`).join('')||'<p class="mu">Nenhuma conta neste mês. Toque em “Adicionar gasto”.</p>'}</section>
<section class="card s4"><div class="pills">${[['a','Tudo'],['p','Pessoal'],['h','Da casa']].map(([k,t])=>`<button class="pl ${flt===k?'on':''}" data-a="fl" data-k="${k}">${t}</button>`).join('')}</div><h2>Gastos por ramo</h2><small>Mês selecionado, por ramo</small><button class="gh" data-a="cats" style="padding:4px 10px;font-size:12px;margin-top:6px">Editar categorias</button>
<div class="ramo"><svg viewBox="0 0 100 100" width="170" height="170"><circle r="40" cx="50" cy="50" fill="none" stroke="var(--sf)" stroke-width="16"/>${ring}<text x="50" y="48" text-anchor="middle" font-size="6" fill="var(--mu)">Total</text><text x="50" y="57" text-anchor="middle" font-size="7" font-weight="700" fill="var(--tx)">${R(tot)}</text></svg>
<div>${cs.map(([c,v])=>`<div class="cr"><div><span style="all:unset"><i class="d" style="background:${CATS[c]}"></i>${c}</span><b>${R(v)} <small style="display:inline">${Math.round(v/tot*100)}%</small></b></div><span style="width:${v/tot*100}%;background:${CATS[c]}"></span></div>`).join('')||'<p class="mu">Sem gastos.</p>'}</div></div>
<h2 style="margin-top:16px">Últimos 6 meses</h2><div class="hist">${md.map((o,k)=>`<div class="col"><div class="bar">${Object.entries(o).map(([c,v])=>`<i style="height:${v/mx*100}%;background:${CATS[c]}"></i>`).join('')}</div><small>${MA[+ms[k].slice(5)-1]}</small></div>`).join('')}</div></section>
<section class="card s3"><h2>A receber de outras pessoas</h2><small>Gastos que você pagou e dividiu. A parte dos outros já não conta no seu saldo.</small><div class="big" style="color:var(--gr)">${R(rt)}</div>
${who.map(w=>`<div class="ln"><b>${esc(w)} te deve ${R(rcv.filter(x=>x.o.w===w).reduce((a,x)=>a+x.o.a,0))}</b><button class="gh" data-a="rca" data-w="${esc(w)}">Recebi tudo de ${esc(w)}</button></div>${rcv.filter(x=>x.o.w===w).map(x=>`<div class="ln" style="border:0;padding:4px 0"><div>${esc(x.e.n)}<small>${DM(x.e.d)} · total ${R(x.e.t)}</small></div><div class="am">${R(x.o.a)} <button class="gh" data-a="rc" data-i="${x.e.id}" data-j="${x.j}">Recebido</button></div></div>`).join('')}`).join('')||'<p class="mu">Nada a receber.</p>'}</section>
<section class="card s3"><h2>Compras parceladas</h2><small>Parcelas em ${lbl(ym)}: ${R(pm)} · ainda faltam ${R(pf)} nos próximos meses</small><div class="big" style="font-size:22px">${P.length} compras</div>
${P.map(e=>{const[n,N]=e.i,m=mine(e),rest=N-n;return`<div class="ln"><div><b>${esc(e.n)}</b> <span class="bd">${n}/${N}</span><small>${R(m)} por mês · ${e.c}</small><small>${rest?`Faltam ${rest} parcelas (${R(m*rest)}) · última em ${lbl(addM(ym,rest))}`:'Última parcela'}</small><div class="pg"><i style="width:${n/N*100}%"></i></div></div><div class="am">${R(m*rest)}<small>a pagar</small></div></div>`}).join('')||'<p class="mu">Nenhuma parcela neste mês.</p>'}</section>
<section class="card s6"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2>Gastos lançados</h2><div class="tr"><button class="gh" data-a="imp">Importar extrato</button><button class="gh" data-a="clr">${clr?'Confirmar limpeza?':'Limpar mês'}</button><button class="btn" data-a="add">+ Adicionar gasto</button></div></div>
<small>Toque em “Pessoal” ou “Da casa” para escolher quais gastos entram na divisão da casa. Você lançou ${R(L.filter(e=>e.h).reduce((a,e)=>a+e.t,0))} em contas da casa neste mês.</small>
${nc.sort((a,b)=>a.d<b.d?-1:1).map(row).join('')}
${cd.length?`<div class="r"><div class="rn"><b>Fatura do cartão</b><small>${cd.length} compras · ${cd.filter(e=>e.h).length} da casa</small></div><div class="ra"><div><b>${R(sum(cd))}</b><small>total ${R(cd.reduce((a,e)=>a+e.t,0))}</small></div><button class="gh" data-a="op">${open?'⌃':'⌄'}</button></div></div>${open?`<div class="sub">${cd.map(row).join('')}</div>`:''}`:''}</section>`}
function dlg(h,w){const d=$('#dg');d.innerHTML=h;d.style.width=w?'min(640px,94vw)':'';if(!d.open)d.showModal()}
const num=v=>parseFloat(String(v).replace(',','.'));
function addDlg(){dlg(`<h2>Adicionar gasto</h2><label>Descrição</label><input id="n"><label>Valor (R$)</label><input id="t" inputmode="decimal"><div class="two"><div style="flex:1"><label>Categoria</label><select id="c">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join('')}</select></div><div style="flex:1"><label>Tipo</label><select id="h"><option value="0">Pessoal</option><option value="1">Da casa (divide 50%)</option></select></div></div><label>Vencimento</label><input id="d" type="date" value="${ym}-10"><label><input id="cd" type="checkbox" style="width:auto"> Compra no cartão (entra na fatura)</label><div class="two"><div style="flex:1"><label>Parcela atual</label><input id="ia" type="number" min="1" placeholder="1"></div><div style="flex:1"><label>Total de parcelas</label><input id="ib" type="number" min="1" placeholder="1"></div></div><label>O valor informado é</label><select id="vm"><option value="t">O total da compra (divido pelas parcelas)</option><option value="p">O valor de cada parcela</option></select><small id="pv"></small><div class="two"><div style="flex:1"><label>Outra pessoa deve (nome)</label><input id="ow"></div><div style="flex:1"><label>Valor (R$)</label><input id="oa" inputmode="decimal"></div></div><div class="fa"><button class="gh" data-a="cl">Cancelar</button><button class="btn" data-a="sv">Salvar</button></div>`)}
function addSave(){const g=i=>$('#'+i),t=num(g('t').value),nm=g('n').value.trim();if(!nm||!(t>0)){g('n').focus();return}
const a=+g('ia').value||1,b=+g('ib').value||1;if(b>1&&a>b){g('ia').focus();return}const inst=b>1?[a,b]:null,N=inst?b-a+1:1,G=++S.id,pt=inst&&g('vm').value!=='p'?Math.round(t/b*100)/100:t,w=g('ow').value.trim(),oa=num(g('oa').value),d=g('d').value||ym+'-10';
for(let k=0;k<N;k++)S.ex.push({id:++S.id,n:nm,m:addM(ym,k),d:addM(d.slice(0,7),k)+d.slice(7),g:inst?G:0,c:g('c').value,h:+g('h').value,t:pt,card:g('cd').checked?1:0,p:0,i:inst&&[a+k,b],o:w&&oa>0?[{w,a:oa,r:0}]:[]});
save();$('#dg').close();render()}
const catOpts=s=>Object.keys(CATS).map(c=>`<option ${c===s?'selected':''}>${c}</option>`).join(''),gk=e=>e.g||(e.i?e.n+'|'+e.i[1]:null),mem=e=>{const k=gk(e);return k?S.ex.filter(x=>gk(x)===k):[e]},fut=e=>mem(e).filter(x=>x.i&&x.i[0]>=e.i[0]);
let ed=null,imp=[];
function edDlg(e){ed=e;const o=(e.o||[])[0]||{};dlg(`<h2>Editar gasto</h2><label>Descrição</label><input id="n" value="${esc(e.n)}"><label>${e.i?`Valor da parcela (${e.i[0]}/${e.i[1]})`:'Valor total'} (R$)</label><input id="t" inputmode="decimal" value="${String(e.t).replace('.',',')}"><div class="two"><div style="flex:1"><label>Categoria</label><select id="c">${catOpts(e.c)}</select></div><div style="flex:1"><label>Tipo</label><select id="h"><option value="0">Pessoal</option><option value="1" ${e.h?'selected':''}>Da casa (divide 50%)</option></select></div></div><label>Vencimento${e.i?' (só desta parcela)':''}</label><input id="d" type="date" value="${e.d}"><label><input id="cd" type="checkbox" style="width:auto" ${e.card?'checked':''}> Compra no cartão (entra na fatura)</label><div class="two"><div style="flex:1"><label>Outra pessoa deve (nome)</label><input id="ow" value="${esc(o.w||'')}"></div><div style="flex:1"><label>Valor (R$)</label><input id="oa" inputmode="decimal" value="${o.a?String(o.a).replace('.',','):''}"></div></div>${e.i?`<label>Aplicar a</label><select id="sc"><option value="1">Só esta parcela</option><option value="2">Esta e as próximas</option><option value="3">Todas as parcelas</option></select>`:''}<div class="fa"><button class="gh" data-a="cl">Cancelar</button><button class="btn" data-a="es">Salvar</button></div>`)}
function edSave(){const g=i=>$('#'+i),t=num(g('t').value),nm=g('n').value.trim(),e=ed;if(!e||!nm||!(t>0)){g('n').focus();return}

const sc=g('sc')?+g('sc').value:1,tg=sc===3?mem(e):sc===2?fut(e):[e],w=g('ow').value.trim(),oa=num(g('oa').value),f={n:nm,t,c:g('c').value,h:+g('h').value,card:g('cd').checked?1:0};

const KW=[[/mercado livre|shopee|amazon|aliexpress|shein|magalu|americanas|magazine|temu/i,'E-commerce'],[/posto|shell|ipiranga|combust|gasolina|etanol/i,'Combustível'],[/mercado|supermerc|padaria|restaur|ifood|lanch|atacad|a[cç]ougue|hortifruti|pizz|burger|caf[eé]|a[cç]a[ií]/i,'Alimentação'],[/netflix|spotify|disney|prime video|youtube|hbo|apple\.com|google one|assinatura|deezer/i,'Assinatura'],[/renner|riachuelo|c&a|zara|marisa|hering|cal[cç]ados|roupa|vestu/i,'Roupas'],[/cobasi|petz|veterin|ra[cç][aã]o/i,'Gatos'],[/aluguel|\bluz\b|ceee|energia|[aá]gua|dmae|internet|condom[ií]nio/i,'Casa']],guess=s=>{const c=(KW.find(k=>k[0].test(s))||[0,'Outros'])[1];return CATS[c]?c:'Outros'};
const AM=/^[-(]?(R\$)?[-(]?(\d{1,3}(\.\d{3})+|\d+)[,.]\d{2}[-)]?$/;
function pnum(s){s=String(s).replace(/R\$|\s/g,'');const ng=/^-|-$|^\(.*\)$/.test(s);s=s.replace(/[-()]/g,'');s=s.includes(',')?s.replace(/\./g,'').replace(',','.'):s;const v=parseFloat(s);return isNaN(v)?null:ng?-v:v}
function pdt(s){let m;s=String(s).trim();if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+'-'+m[2]+'-'+m[3];if(m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/)){let y=m[3]||ym.slice(0,4);if(y.length===2)y='20'+y;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return null}
function splitL(l,d){const r=[];let c='',q=0;for(const ch of l){if(ch==='"')q=!q;else if(ch===d&&!q){r.push(c);c=''}else c+=ch}r.push(c);return r}
function parseTxt(tx){const out=[];
if(/<STMTTRN>/i.test(tx)){const re=/<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi;let m;while(m=re.exec(tx)){const b=m[1],f=k=>{const r=b.match(new RegExp('<'+k+'>([^<\\r\\n]*)','i'));return r?r[1].trim():''},d=f('DTPOSTED').slice(0,8),v=pnum(f('TRNAMT'));if(d.length===8&&v!==null&&v!==0)out.push({d:d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6),n:f('MEMO')||f('NAME')||'Lançamento',v})}return out}
for(const ln of tx.split(/\r?\n/)){const L=ln.trim();if(!L)continue;let d=null,v=null,n='';
const dl=L.includes(';')?';':L.includes('\t')?'\t':/^\s*"?[\d\/-]{5,10}"?,/.test(L)?',':null;
if(dl){const cs=splitL(L,dl).map(s=>s.trim());let ds=-1;cs.forEach((c,i)=>{if(ds<0&&pdt(c)){ds=i;d=pdt(c)}});const rs=cs.filter((c,i)=>i!==ds),ai=rs.findIndex(c=>AM.test(c.replace(/\s/g,'')));if(ai>=0){v=pnum(rs[ai]);n=rs.filter((c,i)=>i!==ai&&!AM.test(c.replace(/\s/g,''))).sort((a,b)=>b.length-a.length)[0]||''}}
else{const m=L.match(/^(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|\d{4}-\d{2}-\d{2})\s+(.*?)\s+((?:-|\()?\s*(?:R\$)?\s*-?\s*[\d.]+[,.]\d{2}\s*[-)]?)$/);if(m){d=pdt(m[1]);n=m[2];v=pnum(m[3])}}
if(d&&v!==null&&v!==0&&n)out.push({d,n,v})}
return out}
function impView(){const k=imp.filter(r=>r.on).length;$('#ip').innerHTML=imp.length?`<small style="margin-top:12px">${imp.length} lançamentos encontrados · entram em ${lbl(ym)}</small>${imp.map((r,i)=>`<div class="r" style="${r.on?'':'opacity:.5'}"><input type="checkbox" data-a="ir" data-i="${i}" ${r.on?'checked':''}><div class="rn"><b>${esc(r.n)}</b><small>${DM(r.d)}${r.dup?' · parece já lançado':''}</small><select data-a="ic" data-i="${i}">${catOpts(r.c)}</select></div><div class="ra"><button class="pill ${r.h?'on':''}" data-a="ih" data-i="${i}">${r.h?'Da casa':'Pessoal'}</button><b>${R(r.t)}</b></div></div>`).join('')}<div class="fa"><button class="btn" data-a="ii">Importar ${k} gastos</button></div>`:'<small style="margin-top:12px">Nenhum lançamento reconhecido. Use linhas como “05/11 Mercado 123,45”, CSV (data;descrição;valor) ou OFX.</small>'}
function impDlg(){imp=[];dlg(`<h2>Importar extrato</h2><small>Escolha um arquivo CSV, OFX ou TXT, ou cole o texto do extrato. Os gastos entram em ${lbl(ym)}.</small><label>Arquivo</label><input id="if" type="file" accept=".csv,.ofx,.qfx,.txt,text/*"><label>Ou cole aqui</label><textarea id="it" rows="5" placeholder="05/11/2026;Mercado;-123,45"></textarea><label>No extrato, os gastos aparecem como</label><select id="isg"><option value="a">Automático</option><option value="n">Valores negativos (−)</option><option value="p">Valores positivos (+)</option></select><label><input id="icd" type="checkbox" style="width:auto"> Lançar na fatura do cartão</label><label><input id="ipd" type="checkbox" style="width:auto"> Marcar como pagos</label><div class="fa"><button class="gh" data-a="cl">Cancelar</button><button class="btn" data-a="ip">Ler extrato</button></div><div id="ip"></div>`,1)}
function impRead(){const rows=parseTxt($('#it').value).slice(0,500),m=$('#isg').value,hn=rows.some(x=>x.v<0);imp=rows.map(r=>{const t=Math.abs(r.v),n=r.n.replace(/\s+/g,' ').trim();return{on:m==='n'?r.v<0:m==='p'?r.v>0:hn?r.v<0:true,n,d:r.d,t,c:guess(n),h:0,dup:S.ex.some(e=>e.m===ym&&e.d===r.d&&Math.abs(e.t-t)<.005)}});imp.forEach(r=>{if(r.dup)r.on=false});impView()}

function applyCats(){if(S.cats){Object.keys(CATS).forEach(k=>delete CATS[k]);Object.assign(CATS,S.cats)}if(!CATS.Outros)CATS.Outros='#9aa3b5';S.ex.forEach(e=>{if(!CATS[e.c])e.c='Outros'});S.id=Math.max(S.id||0,...S.ex.map(e=>e.id||0))}

function catRen(o,n){n=n.trim();if(!n||n===o||o==='Outros')return catDlg();if(CATS[n])return catDlg('Já existe uma categoria com esse nome.');S.ex.forEach(e=>{if(e.c===o)e.c=n});setCats(Object.fromEntries(Object.entries(CATS).map(([k,v])=>[k===o?n:k,v])))}

function expData(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='controle-financeiro.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}}

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))return;const a=el.dataset.a,id=+el.dataset.i,e=S.ex.find(x=>x.id===id);

else if(a==='fd')fd=el.dataset.d;else if(a==='fl')flt=el.dataset.k;else if(a==='op')open=!open;
else if(a==='tg'&&e)e.h=e.h?0:1;else if(a==='del'&&e){if(!gk(e))S.ex=S.ex.filter(x=>x!==e);else return dlg(`<h2>Excluir parcelada</h2><p>${esc(e.n)} (${e.i[0]}/${e.i[1]}). Quais parcelas excluir?</p><div class="fa" style="flex-wrap:wrap"><button class="gh" data-a="cl">Cancelar</button><button class="gh" data-a="dl" data-s="1" data-i="${e.id}">Só esta</button><button class="gh" data-a="dl" data-s="2" data-i="${e.id}">Esta e as próximas</button><button class="gh" data-a="dl" data-s="3" data-i="${e.id}">Todas</button></div>`)}else if(a==='dl'&&e){const s=+el.dataset.s,r=s===3?mem(e):s===2?fut(e):[e];S.ex=S.ex.filter(x=>!r.includes(x));$('#dg').close()}else if(a==='ed'&&e)return edDlg(e);else if(a==='es')return edSave();else if(a==='imp')return impDlg();else if(a==='cats')return catDlg();else if(a==='cdl')return catDel(el.dataset.k);else if(a==='ca')return catAdd();else if(a==='exp')return expData();else if(a==='ip')return impRead();else if(a==='ii')return impGo();else if(a==='ih'){imp[id].h=imp[id].h?0:1;return impView()}
else if(a==='rc'&&e)e.o[+el.dataset.j].r=1;else if(a==='rca')S.ex.forEach(x=>{if(x.m===ym)(x.o||[]).forEach(o=>{if(o.w===el.dataset.w)o.r=1})});
else if(a==='clr'){if(!clr){clr=1;return render()}S.ex=S.ex.filter(x=>x.m!==ym);clr=0}
save();render()});
document.addEventListener('change',ev=>{const el=ev.target,a=el.dataset.a;if(a==='cn')return catRen(el.dataset.k,el.value);if(a==='cc'){CATS[el.dataset.k]=el.value;return setCats({...CATS},1)}if(el.id==='bk'&&el.files[0])return impData(el.files[0]);if(a==='ir'){imp[+el.dataset.i].on=el.checked;return impView()}if(a==='ic'){imp[+el.dataset.i].c=el.value;return}if(el.id==='if'&&el.files[0]){const f=el.files[0],rd=new FileReader();rd.onload=()=>{const s=String(rd.result);if(s.includes('\uFFFD')&&!rd.r){rd.r=1;rd.readAsText(f,'windows-1252');return}$('#it').value=s;impRead()};rd.readAsText(f);return}if(a==='pay'){const k=el.dataset.i,v=el.checked?1:0;S.ex.forEach(e=>{if(k==='card'?(e.card&&e.m===ym):e.id===+k)e.p=v})}else if(a==='cat'){const e=S.ex.find(x=>x.id===+el.dataset.i);if(e)e.c=el.value}else return;save();render()});
